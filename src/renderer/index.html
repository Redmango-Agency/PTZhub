<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>PTZ Hub</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Barra del titolo (la finestra non ha la cornice di sistema) -->
  <div class="titlebar" id="titlebar">
    <div class="tb-drag">
      <span class="tb-icon" data-icon="app"></span>
      <span class="tb-title" id="tbTitle">PTZ Hub</span>
    </div>
    <div class="tb-controls" id="tbControls">
      <button class="tb-btn" data-win="minimize" data-icon="minimize" data-i18n-label="win.minimize" data-i18n-title="win.minimize"></button>
      <button class="tb-btn" data-win="maximize" id="tbMax" data-i18n-label="win.maximize" data-i18n-title="win.maximize"></button>
      <button class="tb-btn close" data-win="close" data-icon="close" data-i18n-label="win.close" data-i18n-title="win.close"></button>
    </div>
    <!-- impostazioni e primo avvio occupano tutta la finestra: STOP resta comunque a portata -->
    <button class="tb-stop" id="btnStopPage" data-i18n="a.stop"></button>
    <button class="tb-btn close" id="btnCloseSettings" data-icon="close" data-i18n-label="s.close" data-i18n-title="s.close"></button>
  </div>

  <!-- ===================================================================== Regia -->
  <div class="regia" id="regia">
    <header class="top">
      <div class="status-pill" id="camStatus">
        <span class="dot"></span>
        <span class="cam-name" id="camLabel"></span>
        <span class="cam-state" id="camDetail"></span>
      </div>
      <div class="edit-pill" id="editPill"><span data-icon="pencil"></span><span data-i18n="ed.mode"></span></div>
      <div class="account" id="accountBox"><span data-icon="user"></span><span><span data-i18n="top.account"></span> <b id="account"></b></span></div>
      <div class="update-pill" id="updatePill" hidden>
        <button id="btnUpdate" class="up-link" data-i18n-title="up.availableTitle"><span data-icon="download"></span><span id="btnUpdateText"></span></button>
        <button id="btnUpdateLater" class="up-x" data-icon="x" data-i18n-title="up.later" data-i18n-label="up.later"></button>
      </div>
      <div class="spacer"></div>
      <div class="seg view-seg" id="viewSeg" role="group" data-i18n-label="top.view">
        <button data-view="full" data-i18n="top.full"></button>
        <button data-view="compact" data-i18n="top.compact" data-i18n-title="top.compactTitle"></button>
        <button data-view="side" data-i18n="top.side" data-i18n-title="top.sideTitle"></button>
      </div>
      <div class="seg icon-seg" id="sideSeg" role="group" data-i18n-label="top.sideGroup">
        <button data-side="left" data-icon="sideLeft" data-i18n-title="top.sideLeft" data-i18n-label="top.sideLeft"></button>
        <button data-side="right" data-icon="sideRight" data-i18n-title="top.sideRight" data-i18n-label="top.sideRight"></button>
      </div>
      <button class="icon-btn pin-btn" id="btnPin" data-icon="pin" data-i18n-title="top.pinTitle" data-i18n-label="top.pinTitle" aria-pressed="false"></button>
      <button class="pill-btn" id="btnSettings" data-icon="gear"><span data-i18n="top.settings"></span></button>
    </header>

    <div class="alert" id="offlineBanner" role="alert" hidden>
      <span data-icon="alert"></span>
      <span class="alert-text">
        <b id="offTitle" data-i18n="off.title"></b>
        <span id="offText" data-i18n="off.text"></span>
      </span>
      <button class="btn-secondary small" id="btnRetry" data-i18n="off.retry"></button>
      <button class="btn-dark small" id="btnCamSettings" data-i18n="off.settings"></button>
    </div>

    <main class="layout">
      <section class="stage" data-i18n-label="preview.label">
        <div class="video-wrap" id="videoWrap">
          <canvas id="video"></canvas>
          <video id="usbVideo" autoplay muted playsinline></video>
          <div class="no-signal" id="previewMsg">
            <span class="ns-icon" data-icon="videoOff"></span>
            <b id="previewTitle"></b>
            <span id="previewSub"></span>
          </div>
          <div class="badge live-badge" id="liveBadge"><span class="rec"></span><span data-i18n="preview.badge"></span></div>
          <div class="badge active-badge" id="activeBadge"></div>
          <div class="badge edit-hint" data-i18n="ed.compose"></div>
          <span class="edit-cross" data-icon="cross"></span>
          <div class="edit-note" id="editNote"></div>
        </div>
      </section>

      <aside class="controls">
        <section class="card ctl-card move">
          <div class="card-head">
            <h2 data-i18n="ctl.move"></h2>
            <button class="keys-link" id="btnKeys" data-icon="keyboard" data-i18n-title="keys.title"><span data-i18n="keys.link"></span></button>
          </div>
          <div class="dpad" id="dpad" role="group" data-i18n-label="ctl.arrows">
            <button type="button" class="dp up" data-dir="up" data-i18n-label="ctl.up"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <button type="button" class="dp left" data-dir="left" data-i18n-label="ctl.left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <button type="button" class="dp fine" id="btnFine" aria-pressed="false" data-i18n="ctl.fine" data-i18n-title="ctl.fineTitle"></button>
            <button type="button" class="dp right" data-dir="right" data-i18n-label="ctl.right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <button type="button" class="dp down" data-dir="down" data-i18n-label="ctl.down"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
          <p class="dp-hint" data-i18n="ctl.dpadHint"></p>
          <label class="slider">
            <span data-i18n="ctl.speed"></span>
            <input type="range" id="moveSpeed" min="0.1" max="1" step="0.05" data-i18n-label="ctl.speedLabel">
            <output id="moveSpeedVal"></output>
          </label>
          <div class="pair">
            <button id="btnHome" class="btn-ctl outline" data-i18n="ctl.home"></button>
            <button id="btnStop" class="btn-stop" data-i18n="ctl.stop" data-i18n-title="ctl.stopTitle"></button>
          </div>
        </section>

        <section class="card ctl-card">
          <div class="card-head">
            <h2 id="zoomTitle" data-i18n="ctl.zoom"></h2>
            <span class="hint" data-i18n="ctl.zoomHint"></span>
          </div>
          <div class="pair">
            <button class="hold btn-ctl fill" data-zoom="-1" data-i18n="ctl.wide"></button>
            <button class="hold btn-ctl fill" data-zoom="1" data-i18n="ctl.tele"></button>
          </div>
          <div class="divider"></div>
          <div class="card-head center">
            <h2 data-i18n="ctl.focus"></h2>
            <div class="seg small" id="focusSeg" role="group" data-i18n-label="ctl.focusMode">
              <button data-af="1" data-i18n="ctl.af"></button>
              <button data-af="0" data-i18n="ctl.mf"></button>
            </div>
          </div>
          <div class="triple">
            <button class="hold btn-ctl outline small" data-focus="-1" data-i18n="ctl.near"></button>
            <button class="hold btn-ctl outline small" data-focus="1" data-i18n="ctl.far"></button>
            <button id="btnOnePush" class="btn-ctl outline small" data-i18n="ctl.onePush" data-i18n-title="ctl.onePushTitle"></button>
          </div>
        </section>
      </aside>
    </main>

    <section class="card presets" id="presetsCard" data-i18n-label="presets.title">
      <div class="presets-head">
        <h2 data-i18n="presets.title"></h2>
        <span class="hint" data-i18n="presets.hint"></span>
        <div class="spacer"></div>
        <label class="slider recall">
          <span data-i18n="presets.recallSpeed"></span>
          <input type="range" id="recallSpeed" min="0.05" max="1" step="0.05" data-i18n-label="presets.recallSpeed">
          <output id="recallSpeedVal"></output>
        </label>
        <button id="btnSavePreset" class="btn-primary" data-i18n="presets.new"></button>
      </div>
      <div id="presetGrid" class="preset-grid"></div>
    </section>

    <section class="card editor" id="editor" data-i18n-label="ed.label">
      <div class="editor-head">
        <h2 id="edTitle"></h2>
        <span class="key-badge" id="edKey"></span>
        <div class="spacer"></div>
        <span class="hint" id="edHint"></span>
      </div>
      <div class="editor-row">
        <label class="ed-name"><span data-i18n="ed.name"></span>
          <input id="edName" maxlength="40" autocomplete="off" data-i18n-placeholder="ed.namePlaceholder">
        </label>
        <div class="ed-tools" id="edExisting">
          <button id="edLeft" class="btn-ctl outline" data-i18n="ed.left" data-i18n-title="ed.leftTitle"></button>
          <button id="edRight" class="btn-ctl outline" data-i18n="ed.right" data-i18n-title="ed.rightTitle"></button>
          <button id="edDelete" class="btn-danger-soft" data-i18n="ed.delete"></button>
        </div>
        <div class="spacer"></div>
        <button id="edSaveName" class="btn-secondary" data-i18n="ed.saveName" data-i18n-title="ed.saveNameTitle"></button>
        <button id="edCancel" class="btn-secondary" data-i18n="ed.cancel"></button>
        <button id="edSave" class="btn-primary big"></button>
      </div>
    </section>
  </div>

  <!-- ===================================================================== Compatta -->
  <div class="compact-view" id="compactView">
    <div class="c-strip">
      <span class="c-grip" data-icon="grip"></span>
      <span class="dot" id="cDot"></span>
      <span class="c-name" id="cName"></span>
      <div class="spacer"></div>
      <button class="mini-btn" id="cSwap" data-icon="swap"></button>
      <button class="mini-btn pin-btn" id="cPin" data-icon="pin" data-i18n-title="top.pinTitle" data-i18n-label="top.pinTitle" aria-pressed="false"></button>
      <button class="mini-btn" id="cFull" data-icon="expand" data-i18n-title="v.openFull" data-i18n-label="v.openFull"></button>
    </div>
    <nav class="c-list" id="compactList" data-i18n-label="presets.title"></nav>
    <!-- solo inquadrature: Home e STOP stanno sotto il joystick della vista completa (STOP resta su Esc e Spazio) -->
    <div class="c-foot">
      <button class="c-open" id="cOpen" data-i18n="v.openFull"></button>
    </div>
  </div>

  <!-- ===================================================================== Impostazioni -->
  <section class="settings" id="settingsPage">
    <nav class="s-nav" data-i18n-label="s.sections">
      <button class="s-link" data-sec="camera"><span class="s-ico" style="background:#0071E3" data-icon="secCamera"></span><span data-i18n="s.camera"></span></button>
      <button class="s-link" data-sec="video"><span class="s-ico" style="background:#5E5CE6" data-icon="secVideo"></span><span data-i18n="s.preview"></span></button>
      <button class="s-link" data-sec="presets"><span class="s-ico" style="background:#FF9500" data-icon="secPresets"></span><span data-i18n="s.presetsNav"></span></button>
      <button class="s-link" data-sec="external"><span class="s-ico" style="background:#34C759" data-icon="secExternal"></span><span data-i18n="x.nav"></span></button>
      <button class="s-link" data-sec="general"><span class="s-ico" style="background:#8E8E93" data-icon="secGeneral"></span><span data-i18n="g.title"></span></button>
      <div class="spacer-v"></div>
      <button class="s-back" id="btnBackRegia" data-i18n="s.back"></button>
    </nav>

    <div class="s-main">
      <div class="s-scroll" id="sScroll">

        <!-- Telecamera -->
        <div class="s-panel" data-panel="camera" id="sCamPanel">
          <div class="s-title"><h1 data-i18n="s.camera"></h1><span class="state-badge" id="sCamBadge"></span></div>
          <section class="group">
            <h2 data-i18n="s.link"></h2>
            <div class="list">
              <div class="row net-only">
                <label for="sHost" class="row-label" data-i18n="s.host"></label>
                <input id="sHost" class="field w180 right mono-num" data-i18n-placeholder="s.hostPlaceholder" autocomplete="off" spellcheck="false">
                <button type="button" class="btn-tool" id="btnDiscover" data-i18n="s.discover"></button>
              </div>
              <div class="row">
                <label for="sProtocol" class="row-label" data-i18n="s.protocol"></label>
                <span class="tag ok" id="sDetected" hidden data-i18n="s.detected"></span>
                <span class="tag warn usb-cam-only" data-i18n="s.uvcBeta"></span>
                <select id="sProtocol" class="field w240">
                  <option value="visca-udp">VISCA over IP — UDP 1259</option>
                  <option value="visca-tcp">VISCA over IP — TCP 5678</option>
                  <option value="visca-sony">Sony VISCA over IP — 52381</option>
                  <option value="onvif">ONVIF</option>
                  <option value="usb" data-i18n="s.uvcOption"></option>
                </select>
              </div>
              <div class="row usb-cam-only">
                <label for="sUvcDevice" class="row-label" data-i18n="s.uvcDevice"></label>
                <select id="sUvcDevice" class="field w300"></select>
                <button type="button" class="btn-tool" id="btnUvcCheck" data-i18n="s.uvcCheck"></button>
              </div>
              <div class="row net-only">
                <label for="sPort" class="row-label" data-i18n="s.port"></label>
                <input id="sPort" class="field w90 right" type="number" min="1" max="65535">
              </div>
              <div class="row net-only" id="rowAddress">
                <label for="sAddress" class="row-label" data-i18n="s.address"></label>
                <input id="sAddress" class="field w90 right" type="number" min="1" max="7">
              </div>
            </div>
            <div class="result-line net-only" id="detectLine">
              <span class="rl-icon" id="detectIcon"></span>
              <span class="rl-text" id="detectText"></span>
              <div class="spacer"></div>
              <button type="button" class="link-btn" id="btnDetect" data-i18n="s.detect"></button>
            </div>
            <details class="details net-only" id="detectDetails" hidden>
              <summary data-i18n="s.details"></summary>
              <div id="discoverOut" class="out"></div>
            </details>
            <div class="found net-only" id="foundList" hidden></div>
            <div class="result-line usb-cam-only" id="uvcLine">
              <span class="rl-icon" id="uvcIcon"></span>
              <span class="rl-text" id="uvcText"></span>
            </div>
            <div id="uvcOut" class="out usb-cam-only"></div>
            <p class="note usb-cam-only" data-i18n="s.uvcNote"></p>
          </section>

          <section class="group net-only">
            <h2 data-i18n="s.access"></h2>
            <div class="list">
              <div class="row">
                <label for="sUser" class="row-label" data-i18n="s.userShort"></label>
                <input id="sUser" class="field w220" autocomplete="off" spellcheck="false">
              </div>
              <div class="row">
                <label for="sPass" class="row-label" data-i18n="s.pass"></label>
                <input id="sPass" class="field w220" type="password" autocomplete="off">
              </div>
            </div>
          </section>

          <section class="group">
            <h2 data-i18n="s.mount"></h2>
            <div class="list">
              <label class="row"><span class="row-label" data-i18n="s.invertPan"></span><input type="checkbox" class="switch" id="sInvertPan"></label>
              <label class="row"><span class="row-label"><span data-i18n="s.invertTilt"></span> <span class="muted" data-i18n="s.invertTiltNote"></span></span><input type="checkbox" class="switch" id="sInvertTilt"></label>
            </div>
          </section>
        </div>

        <!-- Anteprima video -->
        <div class="s-panel" data-panel="video">
          <div class="s-title-block">
            <div class="s-title"><h1 data-i18n="s.preview"></h1><span class="state-badge" id="sVideoBadge"></span></div>
            <p class="lead" data-i18n="s.previewLead"></p>
          </div>
          <section class="group">
            <h2 data-i18n="s.source"></h2>
            <div class="list">
              <div class="row wrap">
                <span class="row-label" data-i18n="s.sourceQ"></span>
                <div class="seg small" id="sSource" role="group" data-i18n-label="s.source">
                  <button type="button" data-v="rtsp" data-i18n="s.sourceRtsp"></button>
                  <button type="button" data-v="usb" data-i18n="s.sourceUsb"></button>
                  <button type="button" data-v="none" data-i18n="s.sourceNone"></button>
                </div>
              </div>
            </div>
          </section>
          <section class="group rtsp-only">
            <h2 data-i18n="s.stream"></h2>
            <div class="list">
              <div class="row wrap">
                <label for="sRtsp" class="row-label" data-i18n="s.rtspShort"></label>
                <input id="sRtsp" class="field w300 mono" placeholder="rtsp://192.168.1.50:554/1" autocomplete="off" spellcheck="false" data-i18n-label="s.rtsp">
                <button type="button" class="btn-tool" id="btnFindRtsp" data-i18n="s.find"></button>
                <button type="button" class="btn-tool" id="btnTestRtsp" data-i18n="s.test"></button>
              </div>
              <div class="row result" id="rtspLine">
                <span class="rl-icon" id="rtspIcon"></span>
                <span class="rl-text" id="rtspText"></span>
              </div>
            </div>
            <div id="rtspOut" class="out picks"></div>
            <p class="note" data-i18n="s.usbNote"></p>
          </section>
          <section class="group usb-only">
            <h2 data-i18n="s.usb"></h2>
            <div class="list">
              <div class="row">
                <label for="sUsb" class="row-label" data-i18n="s.usbDevice"></label>
                <select id="sUsb" class="field w300"></select>
              </div>
            </div>
          </section>
          <section class="group">
            <h2 data-i18n="s.image"></h2>
            <div class="list">
              <div class="row">
                <span class="row-label two"><span data-i18n="s.quality"></span><small data-i18n="s.qualityNote"></small></span>
                <select id="sWidth" class="field w220">
                  <option value="640" data-i18n="s.qualityLow"></option>
                  <option value="960" data-i18n="s.qualityMid"></option>
                  <option value="1280" data-i18n="s.qualityHigh"></option>
                </select>
              </div>
              <label class="row"><span class="row-label two"><span data-i18n="s.rotate"></span><small data-i18n="s.rotateNote"></small></span><input type="checkbox" class="switch" id="sRotate"></label>
              <label class="row"><span class="row-label two"><span data-i18n="s.grid"></span><small data-i18n="s.gridNote"></small></span><input type="checkbox" class="switch" id="sGrid"></label>
            </div>
          </section>
        </div>

        <!-- Inquadrature -->
        <div class="s-panel" data-panel="presets">
          <div class="s-title"><h1 data-i18n="s.presetsNav"></h1><span class="state-badge neutral" id="sPresetsBadge"></span></div>
          <section class="group">
            <h2 data-i18n="s.presetMode"></h2>
            <div class="list">
              <label class="row radio-row" id="modeAppRow">
                <input type="radio" name="presetMode" value="app" id="sModeApp">
                <span class="row-label two">
                  <span class="strong"><span data-i18n="s.modeApp"></span> <span class="good" data-i18n="s.recommended"></span></span>
                  <small data-i18n="s.noteApp"></small>
                </span>
              </label>
              <label class="row radio-row" id="modeSlotRow">
                <input type="radio" name="presetMode" value="slot" id="sModeSlot">
                <span class="row-label two">
                  <span class="strong" data-i18n="s.modeSlot"></span>
                  <small data-i18n="s.noteSlot"></small>
                  <span class="slot-line"><span data-i18n="s.slotBase"></span>
                    <input id="sSlotBase" class="field w70 right" type="number" min="0" max="240" data-i18n-label="s.slotBase">
                    <span class="muted" data-i18n="s.slotMax"></span></span>
                </span>
              </label>
            </div>
          </section>
          <section class="group">
            <h2 data-i18n="s.copyMove"></h2>
            <div class="list">
              <div class="row">
                <span class="row-label two"><span data-i18n="s.exportRow"></span><small data-i18n="s.exportNote"></small></span>
                <button type="button" class="btn-tool" id="btnExport" data-i18n="s.export"></button>
              </div>
              <div class="row">
                <span class="row-label two"><span data-i18n="s.importRow"></span><small data-i18n="s.importNote"></small></span>
                <button type="button" class="btn-tool" id="btnImport" data-i18n="s.import"></button>
              </div>
              <div class="row">
                <span class="row-label two"><span data-i18n="s.dataFolderRow"></span><small class="path" id="sDataDir"></small></span>
                <button type="button" class="btn-tool" id="btnDataFolder" data-i18n="s.open"></button>
              </div>
            </div>
          </section>
        </div>

        <!-- Comandi esterni -->
        <div class="s-panel" data-panel="external">
          <div class="s-title-block">
            <h1 data-i18n="x.nav"></h1>
            <p class="lead" data-i18n="x.lead"></p>
          </div>
          <label class="status-card">
            <span class="big-dot" id="xDot"></span>
            <span class="row-label two"><span class="strong" id="xStatusTitle"></span><small id="xStatus"></small></span>
            <input type="checkbox" class="switch" id="xEnable" data-i18n-label="x.enable">
          </label>
          <section class="group">
            <h2 data-i18n="x.obsPanel"></h2>
            <div class="box">
              <div class="obs-url">
                <input id="xObsUrl" class="field mono grow" readonly data-i18n-label="x.obsUrl">
                <button type="button" class="btn-primary compact" id="xCopyObs" data-i18n="x.copy"></button>
              </div>
              <ol class="chips">
                <li data-i18n="x.step1"></li>
                <li data-i18n="x.step2"></li>
                <li data-i18n="x.step3"></li>
              </ol>
            </div>
          </section>
          <section class="group">
            <h2 data-i18n="x.decks"></h2>
            <div class="list">
              <button type="button" class="row nav-row" id="xCommands">
                <span class="row-label two"><span data-i18n="x.commands"></span><small id="xCommandsInfo"></small></span>
                <span class="chev" data-icon="chevron"></span>
              </button>
              <label class="row"><span class="row-label two"><span data-i18n="x.ready"></span><small data-i18n="x.readyNote"></small></span><input type="checkbox" class="switch" id="sGlobal"></label>
            </div>
          </section>
          <section class="group">
            <h2 data-i18n="x.security"></h2>
            <div class="list">
              <label class="row"><span class="row-label two"><span data-i18n="x.lanShort"></span><small data-i18n="x.lanNote"></small></span><input type="checkbox" class="switch" id="xLan"></label>
              <div class="row warn-row" id="xLanWarn" hidden><span data-icon="warnDot"></span><span class="rl-text" data-i18n="x.lanWarn"></span></div>
              <div class="row">
                <label for="xPort" class="row-label" data-i18n="x.port"></label>
                <input id="xPort" class="field w90 right" type="number" min="1024" max="65535">
              </div>
              <div class="row">
                <span class="row-label two"><span data-i18n="x.keyRow"></span><small data-i18n="x.keyNote"></small></span>
                <button type="button" class="btn-tool" id="xNewKey" data-i18n="x.newKey"></button>
              </div>
            </div>
          </section>
        </div>

        <!-- Generale -->
        <div class="s-panel" data-panel="general">
          <div class="s-title"><h1 data-i18n="g.title"></h1></div>
          <section class="group">
            <h2 data-i18n="s.language"></h2>
            <div class="list">
              <div class="row">
                <label for="sLanguage" class="row-label" data-i18n="g.langRow"></label>
                <select id="sLanguage" class="field w260">
                  <option value="auto" data-i18n="s.langAuto"></option>
                  <option value="it">Italiano</option>
                  <option value="en">English</option>
                </select>
              </div>
            </div>
          </section>
          <section class="group">
            <h2 data-i18n="g.reduced"></h2>
            <div class="list">
              <div class="row wrap">
                <span class="row-label two"><span data-i18n="g.side"></span><small data-i18n="g.sideNote"></small></span>
                <div class="seg small" id="sSide" role="group" data-i18n-label="g.side">
                  <button type="button" data-v="left" data-i18n="g.left"></button>
                  <button type="button" data-v="right" data-i18n="g.right"></button>
                </div>
              </div>
              <label class="row"><span class="row-label two"><span data-i18n="g.onTop"></span><small data-i18n="g.onTopNote"></small></span><input type="checkbox" class="switch" id="sOnTop"></label>
            </div>
          </section>
          <section class="group">
            <h2 data-i18n="up.legend"></h2>
            <div class="list">
              <label class="row"><span class="row-label two"><span data-i18n="up.check"></span><small data-i18n="up.checkNote"></small></span><input type="checkbox" class="switch" id="sUpdates"></label>
              <div class="row">
                <span class="row-label two"><span id="updVersion"></span><small id="updStatus"></small></span>
                <button type="button" class="btn-tool" id="btnCheckUpdate" data-i18n="up.checkNow"></button>
              </div>
            </div>
          </section>
          <section class="group">
            <h2 data-i18n="g.account"></h2>
            <div class="list">
              <div class="row">
                <span class="row-label two"><span data-i18n="g.winAccount"></span><small data-i18n="g.winAccountNote"></small></span>
                <span class="strong" id="gAccount"></span>
              </div>
              <div class="row">
                <span class="row-label two"><span data-i18n="g.dataFolder"></span><small class="path" id="gDataDir"></small></span>
                <button type="button" class="btn-tool" id="btnDataFolder2" data-i18n="s.open"></button>
              </div>
            </div>
          </section>
          <section class="group">
            <h2 data-i18n="g.info"></h2>
            <div class="list">
              <div class="row about-row">
                <span class="about-icon" data-icon="appMid"></span>
                <span class="row-label two"><span class="wordmark"><b>PTZ</b><span>hub</span></span><span id="aboutName" class="muted small"></span><small data-i18n="g.license"></small></span>
                <button type="button" class="link-btn" id="btnProject" hidden data-i18n="g.project"></button>
              </div>
              <div class="row">
                <span class="row-label two"><span data-i18n="g.madeBy"></span><small data-i18n="g.madeBySub"></small></span>
                <button type="button" class="link-btn" id="btnCredits" data-i18n="g.credits"></button>
              </div>
            </div>
          </section>
        </div>
      </div>

      <div class="s-foot">
        <button type="button" class="btn-secondary" id="btnCancelSettings" data-i18n="common.cancel"></button>
        <button type="button" class="btn-primary" id="btnSaveSettings" data-i18n="common.save"></button>
      </div>
    </div>
  </section>

  <!-- ===================================================================== Primo avvio -->
  <section class="wizard" id="wizard">
    <div class="wz-scroll">
      <!-- 1 · telecamera -->
      <div class="wz-step" data-step="1">
        <div class="wz-head">
          <span data-icon="appBig"></span>
          <h1 data-i18n="w.findTitle"></h1>
          <p data-i18n="w.findLead"></p>
        </div>
        <ol class="wz-steps"></ol>
        <section class="wz-card">
          <div class="wz-row">
            <span class="rl-icon" id="wzSearchIcon"></span>
            <b id="wzSearchTitle"></b>
            <span class="muted small" id="wzSearchSub"></span>
            <div class="spacer"></div>
            <button class="link-btn" id="wzSearchAgain" data-i18n="w.searchAgain"></button>
          </div>
          <div class="wz-devices" id="wzDevices"></div>
          <div class="wz-manual" id="wzManual" hidden>
            <label for="wzHost" data-i18n="s.host"></label>
            <input id="wzHost" class="field w220 mono-num" data-i18n-placeholder="s.hostPlaceholder" autocomplete="off" spellcheck="false">
            <button class="btn-tool" id="wzCheck" data-i18n="w.check"></button>
          </div>
          <div class="wz-usb" id="wzUsb" hidden>
            <div class="wz-row">
              <b data-i18n="w.usbTitle"></b>
              <span class="tag warn" data-i18n="s.uvcBeta"></span>
              <span class="muted small ellipsis" data-i18n="w.usbSub"></span>
            </div>
            <div class="wz-devices" id="wzUsbDevices"></div>
            <p class="note" data-i18n="s.uvcNote"></p>
          </div>
          <div class="wz-checks" id="wzChecks" hidden>
            <span class="caps" id="wzChecksTitle"></span>
            <div class="wz-check" id="wzCheckCmd"></div>
            <div class="wz-check" id="wzCheckPos"></div>
            <div class="wz-check" id="wzCheckVideo"></div>
            <p class="wz-check-note" id="wzCheckNote" hidden></p>
          </div>
          <div class="wz-actions">
            <button class="link-btn" id="wzManualBtn" data-i18n="w.manual"></button>
            <button class="link-btn" id="wzUsbBtn" data-i18n="w.usbBtn"></button>
            <div class="spacer"></div>
            <button class="btn-primary big" id="wzUse" data-i18n="w.use" disabled></button>
          </div>
        </section>
        <p class="wz-foot"><span data-i18n="w.findFoot"></span> <button class="link-btn inline" id="wzSkip" data-i18n="w.skip"></button></p>
      </div>

      <!-- 2 · video -->
      <div class="wz-step" data-step="2">
        <div class="wz-head">
          <h1 data-i18n="w.videoTitle"></h1>
          <p data-i18n="s.previewLead"></p>
        </div>
        <ol class="wz-steps"></ol>
        <section class="wz-card wide">
          <div class="wz-row">
            <span class="rl-icon" id="wzVideoIcon"></span>
            <b id="wzVideoTitle"></b>
            <span class="muted small mono ellipsis" id="wzVideoUrl"></span>
            <div class="spacer"></div>
            <button class="link-btn" id="wzChangeUrl" data-i18n="w.changeUrl"></button>
          </div>
          <div class="wz-url" id="wzUrlBox" hidden>
            <input id="wzRtsp" class="field grow mono" placeholder="rtsp://192.168.1.50:554/1" autocomplete="off" spellcheck="false" data-i18n-label="s.rtsp">
            <button class="btn-tool" id="wzTest" data-i18n="s.test"></button>
          </div>
          <div class="wz-preview" id="wzPreview">
            <canvas id="wzCanvas"></canvas>
            <div class="badge live-badge on" id="wzLive"><span class="rec"></span><span data-i18n="preview.badge"></span></div>
            <div class="no-signal small" id="wzNoVideo"><span class="ns-icon" data-icon="videoOff"></span><b id="wzNoVideoText"></b></div>
          </div>
          <div class="wz-sources" id="wzSources">
            <label class="choice"><input type="radio" name="wzSrc" value="rtsp"><span class="two"><b data-i18n="s.sourceRtsp"></b><small data-i18n="w.srcRtsp"></small></span></label>
            <label class="choice"><input type="radio" name="wzSrc" value="usb"><span class="two"><b data-i18n="s.sourceUsb"></b><small data-i18n="w.srcUsb"></small></span></label>
            <label class="choice"><input type="radio" name="wzSrc" value="none"><span class="two"><b data-i18n="w.srcNoneTitle"></b><small data-i18n="w.srcNone"></small></span></label>
          </div>
          <div class="wz-actions">
            <button class="btn-secondary big" id="wzBack" data-i18n="w.back"></button>
            <div class="spacer"></div>
            <button class="btn-primary big" id="wzContinue" data-i18n="w.continue"></button>
          </div>
        </section>
        <p class="wz-foot" data-i18n="w.videoFoot"></p>
      </div>

      <!-- 3 · pronto -->
      <div class="wz-step" data-step="3">
        <div class="wz-head">
          <h1 data-i18n="w.readyTitle"></h1>
          <p id="wzReadyLead"></p>
        </div>
        <ol class="wz-steps"></ol>
        <section class="wz-done">
          <div class="wz-summary" id="wzSummary"></div>
          <h2 data-i18n="w.next"></h2>
          <div class="wz-cards">
            <button class="wz-tile primary" id="wzFirstPreset"><b data-i18n="w.firstPreset"></b><span data-i18n="w.firstPresetText"></span></button>
            <button class="wz-tile" id="wzObs"><b data-i18n="w.obs"></b><span data-i18n="w.obsText"></span></button>
            <button class="wz-tile" id="wzReduced"><b data-i18n="w.reduced"></b><span data-i18n="w.reducedText"></span></button>
          </div>
          <div class="wz-center"><button class="btn-secondary big strong" id="wzOpen" data-i18n="w.openRegia"></button></div>
        </section>
        <p class="wz-foot" data-i18n="w.readyFoot"></p>
      </div>
    </div>
  </section>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- Funzioni richiamabili da Stream Deck, Companion, tastiere macro -->
  <dialog id="dlgCommands" class="sheet wide">
    <div class="sheet-head">
      <div class="sheet-title">
        <h1 data-i18n="c.title"></h1>
        <div class="spacer"></div>
        <div class="seg small" id="cmdFilter" role="group" data-i18n-label="c.filter">
          <button type="button" data-v="all" data-i18n="c.all"></button>
          <button type="button" data-v="keyed" data-i18n="c.keyed"></button>
        </div>
      </div>
      <p class="lead small" data-i18n="c.help"></p>
      <p class="note warn" id="cmdApiOff" hidden data-i18n="c.apiOff"></p>
    </div>
    <div class="cmd-table" id="cmdTable"></div>
    <div class="sheet-foot">
      <span class="copied" id="cmdCopied"></span>
      <div class="spacer"></div>
      <button type="button" class="btn-primary" id="cmdDone" data-i18n="c.close"></button>
    </div>
  </dialog>

  <!-- Tasti rapidi della finestra -->
  <dialog id="dlgKeys" class="sheet narrow">
    <div class="sheet-head">
      <div class="sheet-title"><h1 data-i18n="keys.title"></h1></div>
      <p class="lead small" data-i18n="keys.lead"></p>
    </div>
    <div class="keys-list">
      <div class="key-row"><span class="kbd-group"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd></span><span data-i18n="keys.move"></span></div>
      <div class="key-row"><span class="kbd-group"><kbd data-i18n="keys.shift"></kbd></span><span data-i18n="keys.slow"></span></div>
      <div class="key-row"><span class="kbd-group"><kbd data-i18n="keys.pgup"></kbd><kbd data-i18n="keys.pgdn"></kbd><kbd>+</kbd><kbd>−</kbd></span><span data-i18n="keys.zoom"></span></div>
      <div class="key-row"><span class="kbd-group"><kbd>1</kbd><span class="muted">…</span><kbd>9</kbd><kbd>0</kbd></span><span data-i18n="keys.recall"></span></div>
      <div class="key-row"><span class="kbd-group"><kbd>Esc</kbd><kbd data-i18n="keys.space"></kbd></span><span data-i18n="keys.stop"></span></div>
    </div>
    <p class="note keys-global" data-i18n="keys.global"></p>
    <div class="sheet-foot">
      <button type="button" class="link-btn" id="keysToSettings" data-i18n="keys.open"></button>
      <div class="spacer"></div>
      <button type="button" class="btn-primary" id="keysDone" data-i18n="c.close"></button>
    </div>
  </dialog>

  <!-- Conferme (eliminare, nuova chiave, importare…) -->
  <dialog id="dlgConfirm" class="confirm">
    <span class="cf-icon" id="cfIcon"></span>
    <h2 id="cfTitle"></h2>
    <p id="cfText"></p>
    <div class="cf-actions">
      <button type="button" class="btn-secondary" id="cfCancel" data-i18n="common.cancel"></button>
      <button type="button" class="btn-primary" id="cfOk"></button>
    </div>
  </dialog>

  <script src="../shared/i18n.js"></script>
  <script src="../shared/uvc-caps.js"></script>
  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
