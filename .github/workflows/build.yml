name: Build

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Scarica ffmpeg per Windows
        run: node scripts/fetch-ffmpeg.js win32-x64

      - name: Test (telecamere simulate VISCA e ONVIF)
        run: node scripts/ci-annotate.js "Test" -- npm test

      - name: Crea installer e versione portatile
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ptz-hub-windows
          path: |
            dist/PTZ-Hub-Setup-*.exe
            dist/PTZ-Hub-*-portable-win-x64.zip
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Scarica ffmpeg per Mac (Apple Silicon e Intel)
        run: |
          node scripts/fetch-ffmpeg.js darwin-arm64
          node scripts/fetch-ffmpeg.js darwin-x64

      - name: Test
        run: node scripts/ci-annotate.js "Test" -- npm test

      # Senza certificato Apple il dmg non è firmato: al primo avvio serve
      # xattr -cr "/Applications/PTZ Hub.app" (vedi README)
      - name: Crea le immagini disco
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ptz-hub-mac
          path: dist/PTZ-Hub-*.dmg
          if-no-files-found: error

  streamdeck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamdeck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: streamdeck/package-lock.json

      - name: Installa le dipendenze del plugin
        run: npm ci

      - name: Test del plugin
        run: node ../scripts/ci-annotate.js "Test del plugin" -- npm test

      - name: Crea il pacchetto per Stream Deck
        run: npm run pack

      - uses: actions/upload-artifact@v4
        with:
          name: ptz-hub-streamdeck
          path: streamdeck/dist/*.streamDeckPlugin
          if-no-files-found: error

  # Una sola release, solo se tutte e tre le compilazioni sono andate bene
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac, streamdeck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Controlla la versione e prepara le note
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$VERSION" || { echo "package.json non è alla versione $VERSION"; exit 1; }
          node scripts/release-notes.js "$VERSION" > notes.md
          cd out && ls -la && sha256sum * > SHA256SUMS.txt

      - name: Pubblica la release
        uses: softprops/action-gh-release@v2
        with:
          name: PTZ Hub ${{ github.ref_name }}
          body_path: notes.md
          files: out/*
          make_latest: true
