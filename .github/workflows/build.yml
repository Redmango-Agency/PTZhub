name: Build

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Scarica ffmpeg per Windows
        run: node scripts/fetch-ffmpeg.js win32-x64

      - name: Test (telecamere simulate VISCA e ONVIF)
        run: npm test

      - name: Crea installer e versione portatile
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ptz-hub-windows
          path: |
            dist/*.exe
            dist/*.zip

      - name: Pubblica la release (solo sui tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
          generate_release_notes: true

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Scarica ffmpeg per Mac (Apple Silicon e Intel)
        run: |
          node scripts/fetch-ffmpeg.js darwin-arm64
          node scripts/fetch-ffmpeg.js darwin-x64

      - name: Test
        run: npm test

      # Senza certificato Apple il dmg non è firmato: al primo avvio serve
      # xattr -cr "/Applications/PTZ Panel.app" (vedi README)
      - name: Crea le immagini disco
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ptz-hub-mac
          path: dist/*.dmg

      - name: Pubblica la release (solo sui tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg

  streamdeck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamdeck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: streamdeck/package-lock.json

      - name: Installa le dipendenze del plugin
        run: npm ci

      - name: Test del plugin
        run: npm test

      - name: Crea il pacchetto per Stream Deck
        run: npm run pack

      - uses: actions/upload-artifact@v4
        with:
          name: ptz-hub-streamdeck
          path: streamdeck/dist/*.streamDeckPlugin

      - name: Pubblica la release (solo sui tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: streamdeck/dist/*.streamDeckPlugin
